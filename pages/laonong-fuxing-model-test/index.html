<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Disaster Oliver Fuxing tribe 3D thin model Cesium test.">
  <title>復興部落模型測試 | Disaster Oliver</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Widgets/widgets.min.css">
  <link rel="stylesheet" href="../../css/style.css?v=20260731-laonong-command-view">
  <link rel="stylesheet" href="../../css/laonong-command.css?v=20260803-laonong-livecams">
</head>
<body class="laonong-command-page fuxing-model-page" data-page="fuxing-model-test">
  <main class="cesium-page">
    <section class="cesium-stage laonong-command-stage" aria-label="復興部落模型測試 3D 場景">
      <div id="cesium-container" class="cesium-container"></div>

      <section class="laonong-title-panel" aria-label="系統標題">
        <div class="laonong-logo-mark"></div>
        <div>
          <p>GLB 模型定位測試</p>
          <h1>復興部落模型測試</h1>
        </div>
      </section>

      <aside class="cesium-control-panel" aria-label="復興模型測試控制">
        <div class="cesium-panel-content">
          <p class="eyebrow">CesiumJS</p>
          <h1>復興部落模型測試</h1>
          <div class="cesium-status-grid">
            <div>
              <span>模型來源</span>
              <strong>真實 UAV GLB</strong>
            </div>
            <div>
              <span>檔案大小</span>
              <strong>約 74MB</strong>
            </div>
            <div>
              <span>地形</span>
              <strong id="terrain-status">載入中</strong>
            </div>
            <div>
              <span>模型</span>
              <strong id="model-status">載入中</strong>
            </div>
            <div>
              <span>座標</span>
              <strong id="position-status">--</strong>
            </div>
            <div>
              <span>偏移/旋轉</span>
              <strong id="offset-status">--</strong>
            </div>
            <div>
              <span>展示模式</span>
              <strong id="display-mode-status">天空島</strong>
            </div>
          </div>
          <div class="cesium-actions" role="group" aria-label="鏡頭控制">
            <button class="button button-primary" type="button" data-camera="overview">總覽</button>
            <button class="button button-secondary" type="button" data-camera="close">近看</button>
            <button class="button button-secondary" type="button" data-camera="top">俯視</button>
            <button class="button button-secondary" type="button" data-camera="island">天空島</button>
          </div>
          <div class="cesium-actions fuxing-nudge-actions" role="group" aria-label="模型水平校正">
            <button class="button button-secondary" type="button" data-nudge-lat="0.0005">北</button>
            <button class="button button-secondary" type="button" data-nudge-lon="-0.0005">西</button>
            <button class="button button-secondary" type="button" data-nudge-lon="0.0005">東</button>
            <button class="button button-secondary" type="button" data-nudge-lat="-0.0005">南</button>
          </div>
          <div class="cesium-actions fuxing-nudge-actions" role="group" aria-label="模型高度與旋轉校正">
            <button class="button button-secondary" type="button" data-nudge-height="-10">降</button>
            <button class="button button-secondary" type="button" data-nudge-height="10">升</button>
            <button class="button button-secondary" type="button" data-nudge-heading="-5">左轉</button>
            <button class="button button-secondary" type="button" data-nudge-heading="5">右轉</button>
          </div>
          <div class="fuxing-slider-controls" aria-label="模型連續微調">
            <label>
              <span>東西</span>
              <input type="range" min="-0.01" max="0.01" step="0.0001" value="0" data-placement-control="lonOffset">
              <strong id="lon-offset-value">0.0000</strong>
            </label>
            <label>
              <span>南北</span>
              <input type="range" min="-0.01" max="0.01" step="0.0001" value="0" data-placement-control="latOffset">
              <strong id="lat-offset-value">0.0000</strong>
            </label>
            <label>
              <span>高度</span>
              <input type="range" min="-250" max="250" step="5" value="0" data-placement-control="heightOffset">
              <strong id="height-offset-value">0m</strong>
            </label>
            <label>
              <span>旋轉</span>
              <input type="range" min="-180" max="180" step="1" value="0" data-placement-control="heading">
              <strong id="heading-value">0deg</strong>
            </label>
          </div>
          <label class="check-field cesium-toggle">
            <input id="model-toggle" type="checkbox" checked>
            <span>顯示真實 UAV 模型</span>
          </label>
          <label class="check-field cesium-toggle">
            <input id="terrain-toggle" type="checkbox" checked>
            <span>地形高度感</span>
          </label>
          <label class="check-field cesium-toggle">
            <input id="sky-island-toggle" type="checkbox" checked>
            <span>天空島展示</span>
          </label>
        </div>
      </aside>

      <div class="cesium-legend" aria-label="復興模型圖例">
        <strong>圖層</strong>
        <span><i class="cesium-real-building"></i>真實 UAV 模型</span>
        <span><i class="cesium-radar"></i>天空島底座</span>
        <span><i class="cesium-real-river"></i>Google 混合衛星</span>
      </div>
    </section>
  </main>

  <script>
    window.CESIUM_BASE_URL = "https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/";
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Cesium.js"></script>
  <script src="../../js/laonong-fuxing-model-test.js?v=20260803-real-uav-sky-island"></script>
</body>
</html>
