<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DF055 立體地形模擬參考</title>
  <link rel="stylesheet" href="three-demo.css">
  <style>
    body {
      background: #06111a;
    }

    .hud {
      border-color: rgba(103, 232, 249, 0.16);
      background: rgba(2, 6, 23, 0.52);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
    }

    .title {
      top: 12px;
      left: 12px;
      padding: 10px 12px;
    }

    .title h1 {
      font-size: 16px;
    }

    .title p {
      font-size: 11px;
    }

    #scene {
      height: calc(100% - 42px);
    }

    .stats {
      top: 12px;
      right: 12px;
      width: 150px;
      padding: 10px;
      background: rgba(2, 6, 23, 0.44);
    }

    .stats > div,
    .stats dl {
      font-size: 11px;
    }

    .controls {
      left: 12px;
      right: 12px;
      bottom: 6px;
      min-height: 34px;
      grid-template-columns: 72px 76px minmax(110px, 1fr);
      gap: 8px;
      padding: 6px 8px;
      background: rgba(7, 12, 18, 0.58);
    }

    .controls button,
    .controls select {
      height: 28px;
      font-size: 12px;
    }

    .controls label {
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .controls label:nth-of-type(2),
    .controls label:nth-of-type(3),
    #resetBtn {
      display: none;
    }

    .legend {
      left: 12px;
      bottom: 54px;
      padding: 7px 9px;
      gap: 8px;
      font-size: 11px;
      background: rgba(2, 6, 23, 0.5);
    }

    .depth-bar {
      width: 110px;
      height: 10px;
    }

    .disclaimer {
      display: none;
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <header class="hud title">
    <h1>DF055 立體地形模擬</h1>
    <p>Debris-Flow 3D Terrain Reference</p>
  </header>
  <section class="hud controls">
    <button id="playBtn" type="button">Play</button>
    <button id="pauseBtn" type="button">Pause</button>
    <button id="resetBtn" type="button">Reset</button>
    <label>時間
      <input id="timeSlider" type="range" min="0" max="60" step="1" value="0">
    </label>
    <label>地形高度
      <input id="zScale" type="range" min="0.6" max="3.5" step="0.1" value="1.8">
    </label>
    <label>速度
      <select id="speedSelect">
        <option value="420">慢</option>
        <option value="240" selected>中</option>
        <option value="120">快</option>
      </select>
    </label>
  </section>
  <aside class="hud stats">
    <div>時間 <strong id="timeLabel">0</strong> 秒</div>
    <dl>
      <dt>最大深度</dt><dd id="maxDepth">--</dd>
      <dt>最大流速</dt><dd id="maxVelocity">--</dd>
      <dt>影響面積</dt><dd id="affectedArea">--</dd>
      <dt>流動面積</dt><dd id="movingArea">--</dd>
    </dl>
  </aside>
  <div class="legend">
    <span>Depth 0 m</span>
    <div class="depth-bar"></div>
    <span>5 m</span>
  </div>
  <script src="three-app.js?v=terrain-embed-clean-2&clean=1"></script>
</body>
</html>
