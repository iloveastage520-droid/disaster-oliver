    function flattenCoords(geometry) {
      const out = [];
      const walk = (node) => {
        if (!Array.isArray(node)) return;
        if (node.length >= 2 && typeof node[0] === "number" && typeof node[1] === "number") {
          out.push([node[0], node[1]]);
          return;
        }
        node.forEach(walk);
      };
      walk(geometry?.coordinates);
      return out;
    }

    function lonLatToTwd97(lon, lat) {
      const a = 6378137;
      const b = 6356752.314245;
      const lng0 = 121 * Math.PI / 180;
      const k0 = 0.9999;
      const dx = 250000;
      const e = Math.sqrt(1 - (b * b) / (a * a));
      const e2 = e * e / (1 - e * e);
      const n = (a - b) / (a + b);
      const latRad = lat * Math.PI / 180;
      const p = lon * Math.PI / 180 - lng0;
      const nu = a / Math.sqrt(1 - e * e * Math.sin(latRad) ** 2);
      const a0 = a * (1 - n + (5 / 4) * (n * n - n ** 3) + (81 / 64) * (n ** 4 - n ** 5));
      const b0 = (3 * a * n / 2) * (1 - n + (7 / 8) * (n * n - n ** 3) + (55 / 64) * (n ** 4 - n ** 5));
      const c0 = (15 * a * n * n / 16) * (1 - n + (3 / 4) * (n * n - n ** 3));
      const d0 = (35 * a * n ** 3 / 48) * (1 - n + (11 / 16) * (n * n - n ** 3));
      const e0 = (315 * a * n ** 4 / 51) * (1 - n);
      const s = a0 * latRad - b0 * Math.sin(2 * latRad) + c0 * Math.sin(4 * latRad) - d0 * Math.sin(6 * latRad) + e0 * Math.sin(8 * latRad);
      const y = s * k0 + (k0 * nu * Math.sin(2 * latRad) / 4) * p * p +
        (k0 * nu * Math.sin(latRad) * Math.cos(latRad) ** 3 / 24) *
        (5 - Math.tan(latRad) ** 2 + 9 * e2 * Math.cos(latRad) ** 2 + 4 * e2 ** 2 * Math.cos(latRad) ** 4) * p ** 4;
      const x = dx + k0 * nu * Math.cos(latRad) * p +
        (k0 * nu * Math.cos(latRad) ** 3 / 6) * (1 - Math.tan(latRad) ** 2 + e2 * Math.cos(latRad) ** 2) * p ** 3;
      return { x, y };
    }

    function pointInPolygon(point, ring) {
      const [x, y] = point;
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i].x, yi = ring[i].y;
        const xj = ring[j].x, yj = ring[j].y;
        const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function distanceToPolyline(x, y, points) {
      let best = Infinity;
      for (let i = 1; i < points.length; i += 1) {
        const a = points[i - 1];
        const b = points[i];
        const vx = b.x - a.x;
        const vy = b.y - a.y;
        const len2 = vx * vx + vy * vy || 1;
        const t = Math.max(0, Math.min(1, ((x - a.x) * vx + (y - a.y) * vy) / len2));
        const px = a.x + vx * t;
        const py = a.y + vy * t;
        best = Math.min(best, Math.hypot(x - px, y - py));
      }
      return best;
    }

    function makeTextSprite(text, color = "#e0f2fe") {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");
      ctx.font = "900 32px Microsoft JhengHei, Arial";
      ctx.fillStyle = "rgba(2, 6, 23, 0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(103, 232, 249, 0.42)";
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
      ctx.fillStyle = color;
      ctx.fillText(text, 18, 46);
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.scale.set(13.2, 3.25, 1);
      return sprite;
    }

    function makeStationSprite(station) {

      canvas.width = 384;
      canvas.height = 96;

      ctx.fillStyle = "rgba(2, 6, 23, 0.76)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(125, 249, 255, 0.52)";
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
      ctx.fillStyle = "#67e8f9";
      ctx.fillText(`${station.name}雨量站`, 18, 40);
      ctx.font = "900 23px Microsoft JhengHei, Arial";
      ctx.fillStyle = station.h24 >= 200 ? "#fb7185" : station.h24 >= 150 ? "#facc15" : "#a5f3fc";
      ctx.fillText(`24hr ${station.h24} mm`, 18, 72);
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.scale.set(18.2, 4.55, 1);
      return sprite;
    }

    function makeObservationLabel(site) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 116;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "rgba(2, 6, 23, 0.82)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(244, 114, 182, 0.72)";
      ctx.lineWidth = 3;
      ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);
      ctx.fillStyle = "#f9a8d4";
      ctx.font = "950 26px Microsoft JhengHei, Arial";
      ctx.fillText("OBSERVATION CAMERA", 22, 42);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "950 34px Microsoft JhengHei, Arial";
      ctx.fillText(site.name, 22, 86);
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0 }));
      sprite.scale.set(24, 5.4, 1);
      return sprite;
    }

    function createObservationTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext("2d");
      const texture = new THREE.CanvasTexture(canvas);
      const paintFrame = (img) => {
        const grd = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grd.addColorStop(0, "#061827");
        grd.addColorStop(1, "#020617");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (img?.complete && img.naturalWidth > 0) {
          const scale = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
          const w = img.naturalWidth * scale;
          const h = img.naturalHeight * scale;
          ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
          ctx.fillStyle = "rgba(2, 6, 23, 0.24)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = "#67e8f9";
          ctx.font = "950 28px Microsoft JhengHei, Arial";
          ctx.fillText("WRA CAMERA FEED", 28, 58);
          ctx.fillStyle = "#cbd5e1";
          ctx.font = "850 22px Microsoft JhengHei, Arial";
          ctx.fillText("影像載入中", 28, 100);
        }
        ctx.strokeStyle = "rgba(125, 249, 255, 0.85)";
        ctx.lineWidth = 5;
        ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
        ctx.fillStyle = "rgba(2, 6, 23, 0.76)";
        ctx.fillRect(0, canvas.height - 46, canvas.width, 46);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "950 22px Microsoft JhengHei, Arial";
        ctx.fillText("水利署即時水情影像", 24, canvas.height - 16);
        texture.needsUpdate = true;
      };
      paintFrame();
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => paintFrame(img);
      img.onerror = () => paintFrame();
      img.src = `${wraImageUrl}&_=${Date.now()}`;
      setInterval(() => {
        img.src = `${wraImageUrl}&_=${Date.now()}`;
      }, 60000);
      return texture;
    }

    function revealObservationScreens() {
      observationRevealStart = performance.now();
      observationScreens.forEach((entry) => {
        entry.group.visible = true;
        entry.group.scale.setScalar(0.62);
        entry.material.opacity = 0;
        entry.label.material.opacity = 0;
        entry.frame.opacity = 0;
      });
    }

    function selectStreamOnTerrain(id) {
      selectedStreamId = id || null;
      window.selectedStreamId = selectedStreamId;
      streamMarkers.forEach((marker) => {
        const selected = marker.id === selectedStreamId;
        const dimmed = Boolean(selectedStreamId) && !selected;
        marker.dot.material.transparent = dimmed;
        marker.dot.material.opacity = dimmed ? 0.36 : 1;
        marker.dot.material.emissiveIntensity = selected ? 2.9 : marker.red ? 1.15 : 0.92;
        marker.halo.material.opacity = selected ? 0.72 : dimmed ? 0.08 : marker.red ? 0.32 : 0.22;
        marker.label.material.opacity = selected ? 1 : dimmed ? 0.28 : 0.92;
        marker.label.scale.setScalar(selected ? 1.34 : 1);
        marker.lines.forEach(({ line, baseOpacity, selectedOpacity }) => {
          line.material.opacity = selected ? selectedOpacity : dimmed ? Math.min(baseOpacity, 0.16) : baseOpacity;
        });
      });
    }

    function updateCamera() {
      const radius = 172 * zoom;
      camera.position.set(Math.sin(yaw) * radius, 82 + pitch * 40, Math.cos(yaw) * radius);
      camera.lookAt(0, 15, 0);
    }

    function startTerrainRise() {
      terrainRise = 0.035;
      terrainRiseStart = performance.now();
      flowRevealStart = performance.now();
      group.traverse((object) => {
        if (object.userData.rainfallSurface) return;
        object.visible = true;
      });
      group.scale.y = terrainRise;
      group.position.y = -3.2;
      revealLines.forEach(({ line }) => line.geometry.setDrawRange(0, 0));
      animatedMaterials.forEach((entry) => {
        if (!entry.rainfall) return;
        entry.mesh.visible = false;
        entry.material.opacity = 0;
      });
      observationScreens.forEach((entry) => {
        entry.group.visible = false;
        entry.material.opacity = 0;
        entry.label.material.opacity = 0;
        entry.frame.opacity = 0;
      });
    }

    function collapseTerrain() {
      terrainRiseStart = null;
      flowRevealStart = null;
      terrainRise = 0.001;
      group.scale.y = terrainRise;
      group.position.y = -3.2;
      group.traverse((object) => {
        if (object !== group && !object.userData.defaultCollapsedVisible) object.visible = false;
      });
      revealLines.forEach(({ line }) => line.geometry.setDrawRange(0, 0));
    }

    function revealRainfallSurface() {
      rainfallRevealStart = performance.now();
      animatedMaterials.forEach((entry) => {
        if (!entry.rainfall) return;
        entry.mesh.visible = true;
        entry.material.opacity = 0;
      });
    }

    function hideRainfallSurface() {
      rainfallRevealStart = null;
      animatedMaterials.forEach((entry) => {
        if (!entry.rainfall) return;
        entry.mesh.visible = false;
        entry.material.opacity = 0;
      });
    }

    function sampleMeshHeight(mesh, x, y) {
      const xs = mesh.grid.xs;
      const ys = mesh.grid.ys;
      let best = mesh.elevation.min;
      let dist = Infinity;
      for (let r = 0; r < ys.length; r += 1) {
        for (let c = 0; c < xs.length; c += 1) {
          const d = Math.abs(xs[c] - x) + Math.abs(ys[r] - y);
          if (d < dist) {
            dist = d;
            best = mesh.heights[r][c];
          }
        }
      }
      return { height: best, dist };
    }

    function estimateHeight(x, y, meshes, riverPoints, extent) {
      let weighted = 0;
      let weight = 0;
      meshes.forEach(({ mesh }) => {
        const centerX = (mesh.bounds.xmin + mesh.bounds.xmax) / 2;
        const centerY = (mesh.bounds.ymin + mesh.bounds.ymax) / 2;
        const d = Math.hypot(x - centerX, y - centerY);
        const s = sampleMeshHeight(mesh, x, y);
        const w = 1 / Math.max(850, d + s.dist * 0.55);
        weighted += s.height * w;
        weight += w;
      });
      const nx = (x - extent.minX) / Math.max(extent.maxX - extent.minX, 1);
      const ny = (y - extent.minY) / Math.max(extent.maxY - extent.minY, 1);
      const regional = 360 + ny * 760 + nx * 260 + Math.sin(nx * 18 + ny * 4) * 42 + Math.cos(ny * 20 - nx * 5) * 34;
      let h = weight ? weighted / weight * 0.82 + regional * 0.18 : regional;
      const riverD = distanceToPolyline(x, y, riverPoints);
      const valley = Math.max(0, 1 - riverD / 2200);
      h -= valley * 210;
      return h;
    }

    function shapeRiverCorridorHeight(rawH, riverD, corridorWidth) {
      const across = Math.max(0, Math.min(1, riverD / corridorWidth));
      const wall = Math.pow(Math.sin(across * Math.PI), 1.35) * 520;
      const rim = Math.pow(across, 2.4) * 260;
      const centerCut = Math.max(0, 1 - riverD / 1500) * 180;
      return rawH * 0.72 + wall + rim - centerCut;
    }

    function distanceToItems(x, y, items) {
      return items.reduce((best, item) => {
        const center = item.centroidTwd97;
        if (!center) return best;
        const centerDistance = Math.hypot(x - center[0], y - center[1]);
        const flowDistance = item.officialFlowlineTwd97?.length > 1
          ? distanceToPolyline(x, y, item.officialFlowlineTwd97)
          : Infinity;
        return Math.min(best, centerDistance, flowDistance);
      }, Infinity);
    }

    function scenePoint(x, y, z, extent, scale, minH, zScale) {
      return new THREE.Vector3(
        (x - extent.centerX) * scale,
        (z - minH) * zScale,
        -((y - extent.centerY) * scale)
      );
    }

    function addTaiwanOutlineLayer(taiwan, basinExtent, basinScale) {
      if (!showTaiwanOutline) return;
      const coords = flattenCoords(taiwan.features?.[0]?.geometry);
      const points = coords.map(([lon, lat]) => lonLatToTwd97(lon, lat));
      const linePoints = points.map((point) => new THREE.Vector3(
        (point.x - basinExtent.centerX) * basinScale,
        -1.15,
        -((point.y - basinExtent.centerY) * basinScale)
      ));
      const coastline = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(linePoints),
        new THREE.LineBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.78 })
      );
      coastline.userData.defaultCollapsedVisible = true;
      group.add(coastline);
      const glow = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(linePoints),
        new THREE.LineBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.2 })
      );
      glow.scale.setScalar(1.018);
      glow.userData.defaultCollapsedVisible = true;
      group.add(glow);

      const basinCenter = new THREE.Vector3(
        0,
        -0.98,
        0
      );
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.78, 18, 12),
        new THREE.MeshStandardMaterial({ color: 0xfb7185, emissive: 0xfb7185, emissiveIntensity: 1.35 })
      );
      dot.position.copy(basinCenter);
      group.add(dot);
      pulseDots.push({ dot, base: 0.78, red: true });
      const label = makeTextSprite("LAONONG", "#fb7185");
      label.scale.set(15.2, 3.2, 1);
      label.position.copy(basinCenter).add(new THREE.Vector3(7.6, 2.8, 0));
      group.add(label);
    }

    function rainfallColor(value, maxValue) {
      const t = Math.max(0, Math.min(1, value / Math.max(maxValue, 1)));
      if (t < 0.45) return new THREE.Color().setHSL(0.52, 0.92, 0.22 + t * 0.22);
      if (t < 0.72) return new THREE.Color().setHSL(0.14, 0.96, 0.34 + (t - 0.45) * 0.34);
      return new THREE.Color().setHSL(0.97, 0.92, 0.46 + (t - 0.72) * 0.16);
    }

    function estimateRainfallAt(x, y, stationsTwd) {
      let weighted = 0;
      let weight = 0;
      stationsTwd.forEach((station) => {
        const d = Math.hypot(x - station.x, y - station.y);
        const w = 1 / Math.max(1200, d) ** 1.55;
        weighted += station.h24 * w;
        weight += w;
      });
      return weight ? weighted / weight : 0;
    }

    function addRainfallSurface(heights, extent, scale, cols, rows) {
      const stationsTwd = rainStations.map((station) => ({ ...station, ...lonLatToTwd97(station.lon, station.lat) }));
      const maxRain = Math.max(...rainStations.map((station) => station.h24));
      const positions = [];
      const colors = [];
      const indices = [];
      heights.forEach((row) => {
        row.forEach((cell) => {
          positions.push(
            (cell.x - extent.centerX) * scale,
            0.62,
            -((cell.y - extent.centerY) * scale)
          );
          const color = cell.inside ? rainfallColor(estimateRainfallAt(cell.x, cell.y, stationsTwd), maxRain) : new THREE.Color(0x020617);
          colors.push(color.r, color.g, color.b);
        });
      });
      for (let r = 0; r < rows - 1; r += 1) {
        for (let c = 0; c < cols - 1; c += 1) {
          if (!heights[r][c].inside && !heights[r][c + 1].inside && !heights[r + 1][c].inside && !heights[r + 1][c + 1].inside) continue;
          const a = r * cols + c;
          const b = a + 1;
          const d = (r + 1) * cols + c;
          const e = d + 1;
          indices.push(a, d, b, b, d, e);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      const surface = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.24,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      }));
      surface.userData.rainfallSurface = true;
      surface.visible = !startCollapsed;
      group.add(surface);
      animatedMaterials.push({ material: surface.material, mesh: surface, width: 0, height: 0, rainfall: true });
    }

    async function init() {
      const [alerts, river, boundary, taiwan] = await Promise.all([
        fetch(`${alertsUrl}?v=continuous-dem`).then((r) => r.json()),
        fetch(`${riverUrl}?v=continuous-dem`).then((r) => r.json()),
        fetch(`${boundaryUrl}?v=continuous-dem`).then((r) => r.json()),
        showTaiwanOutline ? fetch(`${taiwanOutlineUrl}?v=natural-earth`).then((r) => r.json()) : Promise.resolve(null)
      ]);
      const items = (alerts.items || []).filter((item) => item.terrainMeshUrl);
      const meshes = await Promise.all(items.map(async (item) => {
        const mesh = await fetch(`${item.terrainMeshUrl}?v=continuous-dem`).then((r) => r.json());
        return { item, mesh };
      }));
      const riverPoints = flattenCoords(river.features?.[0]?.geometry).map(([lon, lat]) => lonLatToTwd97(lon, lat));
      const boundaryRing = flattenCoords(boundary.features?.[0]?.geometry).map(([lon, lat]) => lonLatToTwd97(lon, lat));
      const all = boundaryRing.concat(riverPoints);
      const extent = {
        minX: Math.min(...all.map((p) => p.x)),
        maxX: Math.max(...all.map((p) => p.x)),
        minY: Math.min(...all.map((p) => p.y)),
        maxY: Math.max(...all.map((p) => p.y))
      };
      extent.centerX = (extent.minX + extent.maxX) / 2;
      extent.centerY = (extent.minY + extent.maxY) / 2;
      const cols = 160;
      const rows = 196;
      const corridorWidth = 5200;
      const potentialStreamRadius = 7400;
      const scale = 164 / Math.max(extent.maxX - extent.minX, extent.maxY - extent.minY, 1);
      const terrainWidth = (extent.maxX - extent.minX) * scale;
      const terrainHeight = (extent.maxY - extent.minY) * scale;
      const heights = [];
      let minH = Infinity;
      let maxH = -Infinity;
      for (let r = 0; r < rows; r += 1) {
        const row = [];
        for (let c = 0; c < cols; c += 1) {
          const x = extent.minX + (extent.maxX - extent.minX) * c / (cols - 1);
          const y = extent.minY + (extent.maxY - extent.minY) * r / (rows - 1);
          const inside = pointInPolygon([x, y], boundaryRing);
          const riverD = distanceToPolyline(x, y, riverPoints);
          const pointD = distanceToItems(x, y, items);
          const nearPotential = pointD <= potentialStreamRadius;
          const inCorridor = inside;
          const rawH = estimateHeight(x, y, meshes, riverPoints, extent);
          const streamField = Math.max(0, 1 - pointD / potentialStreamRadius);
          const ridgeLift = Math.pow(streamField, 1.45) * 360;
          const valleyShape = shapeRiverCorridorHeight(rawH, riverD, corridorWidth);
          const h = nearPotential
            ? rawH * 0.82 + ridgeLift + valleyShape * 0.12
            : rawH * 0.88 + valleyShape * 0.12;
          row.push({ h, rawH, inside, inCorridor, nearPotential, riverD, pointD, x, y });
          if (inCorridor) {
            minH = Math.min(minH, h);
            maxH = Math.max(maxH, h);
          }
        }
        heights.push(row);
      }
      for (let pass = 0; pass < 2; pass += 1) {
        const next = heights.map((row) => row.map((cell) => ({ ...cell })));
        for (let r = 1; r < rows - 1; r += 1) {
          for (let c = 1; c < cols - 1; c += 1) {
            const cell = heights[r][c];
            if (!cell.inCorridor) continue;
            const near = [
              heights[r][c],
              heights[r - 1][c],
              heights[r + 1][c],
              heights[r][c - 1],
              heights[r][c + 1]
            ].filter((item) => item.inCorridor);
            const avg = near.reduce((sum, item) => sum + item.h, 0) / near.length;
            next[r][c].h = cell.nearPotential
              ? cell.h * 0.56 + avg * 0.44
              : cell.h * 0.38 + avg * 0.62;
          }
        }
        heights.splice(0, heights.length, ...next);
      }
      const zScale = 0.038;
      const positions = [];
      const colors = [];
      const indices = [];
      heights.forEach((row, r) => {
        row.forEach((cell, c) => {
          positions.push(
            (cell.x - extent.centerX) * scale,
            cell.inCorridor ? (cell.h - minH) * zScale : -2.8,
            -((cell.y - extent.centerY) * scale)
          );
          const t = Math.max(0, Math.min(1, (cell.h - minH) / Math.max(maxH - minH, 1)));
          const color = cell.inCorridor
            ? new THREE.Color().setHSL(cell.nearPotential ? 0.52 - t * 0.08 : 0.48 - t * 0.05, cell.nearPotential ? 0.78 : 0.46, cell.nearPotential ? 0.16 + t * 0.24 : 0.11 + t * 0.18)
            : new THREE.Color(0x020617);
          colors.push(color.r, color.g, color.b);
        });
      });
      for (let r = 0; r < rows - 1; r += 1) {
        for (let c = 0; c < cols - 1; c += 1) {
          const a = r * cols + c;
          const b = a + 1;
          const d = (r + 1) * cols + c;
          const e = d + 1;
          if (
            heights[r][c].inCorridor ||
            heights[r][c + 1].inCorridor ||
            heights[r + 1][c].inCorridor ||
            heights[r + 1][c + 1].inCorridor
          ) {
            indices.push(a, d, b, b, d, e);
          }
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      group.add(new THREE.Mesh(geometry, new THREE.MeshLambertMaterial({
        vertexColors: true,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.68,
        emissive: 0x0e7490,
        emissiveIntensity: 0.16
      })));
      group.add(new THREE.LineSegments(new THREE.WireframeGeometry(geometry), new THREE.LineBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.052
      })));

      const riverScene = riverPoints.map((point) => {
        const d = distanceToPolyline(point.x, point.y, riverPoints);
        const h = shapeRiverCorridorHeight(estimateHeight(point.x, point.y, meshes, riverPoints, extent), d, corridorWidth);
        const p = scenePoint(point.x, point.y, h, extent, scale, minH, zScale);
        p.y += 2.2;
        return p;
      });
      const riverCurve = new THREE.CatmullRomCurve3(riverScene);
      const smoothRiver = riverCurve.getPoints(260);
      const riverGlowLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(smoothRiver.map((p) => p.clone().setY(p.y + 0.15))),
        new THREE.LineBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.16 })
      );
      const riverLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(smoothRiver),
        new THREE.LineBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.46 })
      );
      if (startCollapsed) {
        riverGlowLine.geometry.setDrawRange(0, 0);
        riverLine.geometry.setDrawRange(0, 0);
      }
      group.add(riverGlowLine);
      group.add(riverLine);
      revealLines.push(
        { line: riverGlowLine, count: smoothRiver.length, duration: 5600 },
        { line: riverLine, count: smoothRiver.length, duration: 5600 }
      );
      const scanPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(terrainWidth * 0.88, 1.1),
        new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.0, side: THREE.DoubleSide })
      );
      scanPlane.rotation.x = -Math.PI / 2;
      scanPlane.position.y = 3.2;
      group.add(scanPlane);
      animatedMaterials.push({ material: scanPlane.material, mesh: scanPlane, width: terrainWidth, height: terrainHeight });
      addRainfallSurface(heights, extent, scale, cols, rows);

      const boundaryScene = boundaryRing.map((point) => new THREE.Vector3(
        (point.x - extent.centerX) * scale,
        0.08,
        -((point.y - extent.centerY) * scale)
      ));
      boundaryScene.push(boundaryScene[0].clone());
      const boundaryLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(boundaryScene), new THREE.LineBasicMaterial({
        color: 0xbae6fd,
        transparent: true,
        opacity: 0.42
      }));
      boundaryLine.userData.defaultCollapsedVisible = true;
      group.add(boundaryLine);
      if (taiwan) addTaiwanOutlineLayer(taiwan, extent, scale);

      items.forEach((item) => {
        const meshEntry = meshes.find((entry) => entry.item.id === item.id);
        const [x, y] = item.centroidTwd97;
        const d = distanceToPolyline(x, y, riverPoints);
        const h = shapeRiverCorridorHeight(estimateHeight(x, y, meshes, riverPoints, extent), d, corridorWidth);
        const point = scenePoint(x, y, h, extent, scale, minH, zScale);
        point.y += 2.6;
        const red = item.alertLevel === "r";
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(red ? 0.82 : 0.68, 18, 12),
          new THREE.MeshStandardMaterial({
            color: red ? 0xfb7185 : 0xfacc15,
            emissive: red ? 0xfb7185 : 0xfacc15,
            emissiveIntensity: 1.15
          })
        );
        dot.position.copy(point);
        group.add(dot);
        const marker = {
          id: item.id,
          red,
          dot,
          halo: null,
          label: null,
          lines: [],
          defaultDotScale: red ? 0.82 : 0.68
        };
        pulseDots.push({ dot, base: red ? 0.82 : 0.68, red, marker });

        const halo = new THREE.Mesh(
          new THREE.RingGeometry(red ? 1.15 : 0.95, red ? 1.8 : 1.45, 40),
          new THREE.MeshBasicMaterial({
            color: red ? 0xfb7185 : 0xfacc15,
            transparent: true,
            opacity: red ? 0.32 : 0.22,
            side: THREE.DoubleSide
          })
        );
        halo.rotation.x = -Math.PI / 2;
        halo.position.copy(point).setY(point.y - 0.2);
        group.add(halo);
        marker.halo = halo;
        pulseDots.push({ dot: halo, base: 1, red, ring: true, marker });

        const whiteboxFlow = meshEntry?.mesh?.flowline || item.flowlineTwd97 || [];
        if (whiteboxFlow.length > 1) {
          const flow = whiteboxFlow.map((p) => {
            const d = distanceToPolyline(p.x, p.y, riverPoints);
            const hp = shapeRiverCorridorHeight(estimateHeight(p.x, p.y, meshes, riverPoints, extent), d, corridorWidth);
            const sp = scenePoint(p.x, p.y, hp, extent, scale, minH, zScale);
            sp.y += 2.45;
            return sp;
          });
          const flowLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(flow),
            new THREE.LineBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.58 })
          );
          group.add(flowLine);
          marker.lines.push({ line: flowLine, baseOpacity: 0.58, selectedOpacity: 0.96 });
        }

        if (item.officialFlowlineTwd97?.length > 1) {
          const official = item.officialFlowlineTwd97.map((p) => {
            const d = distanceToPolyline(p.x, p.y, riverPoints);
            const hp = shapeRiverCorridorHeight(estimateHeight(p.x, p.y, meshes, riverPoints, extent), d, corridorWidth);
            const sp = scenePoint(p.x, p.y, hp, extent, scale, minH, zScale);
            sp.y += 2.85;
            return sp;
          });
          const officialLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(official),
            new THREE.LineBasicMaterial({ color: red ? 0xff3f5f : 0xfacc15, transparent: true, opacity: red ? 0.94 : 0.78 })
          );
          group.add(officialLine);
          marker.lines.push({ line: officialLine, baseOpacity: red ? 0.94 : 0.78, selectedOpacity: 1 });
        }
        const label = makeTextSprite(item.id.replace("高市", ""), red ? "#fb7185" : "#fde047");
        label.position.copy(point).add(new THREE.Vector3(0, 3.5, 0));
        group.add(label);
        marker.label = label;
        streamMarkers.push(marker);
      });
      window.streamMarkerCount = streamMarkers.length;
      if (selectedStreamId) selectStreamOnTerrain(selectedStreamId);

      rainStations.forEach((station) => {
        const twd = lonLatToTwd97(station.lon, station.lat);
        const d = distanceToPolyline(twd.x, twd.y, riverPoints);
        const h = shapeRiverCorridorHeight(estimateHeight(twd.x, twd.y, meshes, riverPoints, extent), d, corridorWidth);
        const point = scenePoint(twd.x, twd.y, h, extent, scale, minH, zScale);
        point.y += 3.4;
        const heavy = station.h24 >= 200;
        const mid = station.h24 >= 150 && station.h24 < 200;
        const color = heavy ? 0xfb7185 : mid ? 0xfacc15 : 0x22d3ee;
        const stationGroup = new THREE.Group();
        stationGroup.position.copy(point);
        const beacon = new THREE.Mesh(
          new THREE.SphereGeometry(0.56, 18, 12),
          new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.35 })
        );
        stationGroup.add(beacon);
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(1.0, 1.55, 42),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        stationGroup.add(ring);
        const mast = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, -2.4, 0),
            new THREE.Vector3(0, 0.1, 0)
          ]),
          new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.58 })
        );
        stationGroup.add(mast);
        const label = makeStationSprite(station);
        label.position.set(0, 2.9, 0);
        stationGroup.add(label);
        group.add(stationGroup);
        pulseDots.push({ dot: beacon, base: 0.56, red: heavy, station: true });
        pulseDots.push({ dot: ring, base: 1, red: heavy, ring: true, station: true });
      });

      observationSites.forEach((site) => {
        const twd = lonLatToTwd97(site.lon, site.lat);
        const d = distanceToPolyline(twd.x, twd.y, riverPoints);
        const h = shapeRiverCorridorHeight(estimateHeight(twd.x, twd.y, meshes, riverPoints, extent), d, corridorWidth);
        const point = scenePoint(twd.x, twd.y, h, extent, scale, minH, zScale);
        observationAnchors.push({ id: site.id, position: point.clone().add(new THREE.Vector3(0, 4.2, 0)) });
        const screenGroup = new THREE.Group();
        screenGroup.position.copy(point).add(new THREE.Vector3(12, 16, -10));
        screenGroup.rotation.y = -0.22;
        const texture = createObservationTexture();
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide
        });
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(30, 16.875), material);
        screenGroup.add(screen);
        const frame = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(31.2, 18.1, 0.35)),
          new THREE.LineBasicMaterial({ color: 0xf472b6, transparent: true, opacity: 0 })
        );
        frame.position.z = -0.1;
        screenGroup.add(frame);
        const mast = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, -13.5, 0),
            new THREE.Vector3(0, -8.5, 0),
            new THREE.Vector3(0, -8.5, 0),
            new THREE.Vector3(-8, -8.5, 0),
            new THREE.Vector3(0, -8.5, 0),
            new THREE.Vector3(8, -8.5, 0)
          ]),
          new THREE.LineBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.68 })
        );
        screenGroup.add(mast);
        const label = makeObservationLabel(site);
        label.position.set(0, 11.5, 0);
        screenGroup.add(label);
        screenGroup.visible = !startCollapsed;
        screenGroup.scale.setScalar(startCollapsed ? 0.62 : 1);
        observationLayer.add(screenGroup);
        observationScreens.push({ group: screenGroup, material, frame: frame.material, label });
      });

      sampleCountEl.textContent = `${meshes.length} clips`;
      gridSizeEl.textContent = `${cols} x ${rows}`;
      stateEl.textContent = "READY";
      if (startCollapsed) {
        group.scale.y = terrainRise;
        group.position.y = -3.2;
        group.traverse((object) => {
          if (object !== group && !object.userData.defaultCollapsedVisible) object.visible = false;
        });
      }
      updateCamera();
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = performance.now() * 0.001;
      if (terrainRiseStart !== null) {
        const progress = Math.min(1, (performance.now() - terrainRiseStart) / 5200);
        const eased = 1 - Math.pow(1 - progress, 3);
        terrainRise = 0.035 + eased * 0.965;
        group.scale.y = terrainRise;
        group.position.y = -3.2 * (1 - eased);
        if (progress >= 1) {
          terrainRiseStart = null;
          group.scale.y = 1;
          group.position.y = 0;
        }
      }
      if (flowRevealStart !== null) {
        const progress = Math.min(1, (performance.now() - flowRevealStart) / 5600);
        const eased = 1 - Math.pow(1 - progress, 2.2);
        revealLines.forEach(({ line, count }) => {
          line.geometry.setDrawRange(0, Math.max(2, Math.floor(count * eased)));
          line.material.opacity = line.material.color.getHex() === 0x67e8f9
            ? 0.28 + eased * 0.34
            : 0.08 + eased * 0.2;
        });
        if (progress >= 1) flowRevealStart = null;
      }
      if (rainfallRevealStart !== null) {
        const progress = Math.min(1, (performance.now() - rainfallRevealStart) / 7200);
        const eased = 1 - Math.pow(1 - progress, 2.4);
        animatedMaterials.forEach((entry) => {
          if (entry.rainfall) entry.material.opacity = eased * 0.26;
        });
        if (progress >= 1) rainfallRevealStart = null;
      }
      if (observationRevealStart !== null) {
        const progress = Math.min(1, (performance.now() - observationRevealStart) / 1800);
        const eased = 1 - Math.pow(1 - progress, 2.8);
        observationScreens.forEach((entry) => {
          entry.group.scale.setScalar(0.62 + eased * 0.38);
          entry.material.opacity = eased * 0.96;
          entry.frame.opacity = eased * 0.86;
          entry.label.material.opacity = eased * 0.98;
        });
        if (progress >= 1) observationRevealStart = null;
      }
      animatedMaterials.forEach((entry) => {
        if (entry.rainfall) {
          if (!entry.mesh.visible) return;
          if (rainfallRevealStart !== null) return;
          entry.material.opacity = 0.18 + Math.max(0, Math.sin(t * 0.72)) * 0.1;
          return;
        }
        entry.mesh.position.z = Math.sin(t * 0.55) * entry.height * 0.34;
        entry.material.opacity = 0.08 + Math.max(0, Math.sin(t * 0.55)) * 0.08;
      });
      pulseDots.forEach((entry, index) => {
        const selected = entry.marker?.id === selectedStreamId;
        const dimmed = Boolean(selectedStreamId) && !selected && !entry.station;
        const wave = 0.5 + 0.5 * Math.sin(t * (entry.red ? 2.0 : 1.25) + index * 0.7);
        if (entry.ring) {
          const scale = (selected ? 1.32 : dimmed ? 0.82 : 1) + wave * (selected ? 0.62 : entry.red ? 0.42 : 0.26);
          entry.dot.scale.set(scale, scale, scale);
          entry.dot.material.opacity = selected ? 0.5 * (1 - wave * 0.18) : dimmed ? 0.08 : (entry.red ? 0.3 : 0.2) * (1 - wave * 0.45);
        } else {
          const scale = (selected ? 1.42 : dimmed ? 0.78 : 1) + wave * (selected ? 0.38 : entry.red ? 0.28 : 0.14);
          entry.dot.scale.set(scale, scale, scale);
        }
      });
      group.rotation.y += 0.00075;
      observationLayer.rotation.y = group.rotation.y;
      if (isEmbed && observationAnchors.length && performance.now() - anchorPostTick > 80) {
        anchorPostTick = performance.now();
        const width = renderer.domElement.clientWidth || innerWidth;
        const height = renderer.domElement.clientHeight || innerHeight;
        const anchors = observationAnchors.map((anchor) => {
          const projected = anchor.position.clone().applyMatrix4(observationLayer.matrixWorld).project(camera);
          return {
            id: anchor.id,
            x: (projected.x * 0.5 + 0.5) * width,
            y: (-projected.y * 0.5 + 0.5) * height,
            visible: projected.z > -1 && projected.z < 1
          };
        });
        parent.postMessage({ type: "laonong:observation-anchor-positions", anchors }, "*");
      }
      renderer.render(scene, camera);
    }

    function resizeRenderer() {
      const { width, height } = size();
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    addEventListener("resize", resizeRenderer);
    setTimeout(resizeRenderer, 120);
    setTimeout(resizeRenderer, 600);
    renderer.domElement.addEventListener("mousedown", (event) => {
      dragging = true;
      dragStart = { x: event.clientX, y: event.clientY, yaw, pitch };
    });
    addEventListener("mouseup", () => { dragging = false; });
    addEventListener("mousemove", (event) => {
      if (!dragging) return;
      yaw = dragStart.yaw + (event.clientX - dragStart.x) * 0.006;
      pitch = Math.max(0.14, Math.min(1.25, dragStart.pitch + (event.clientY - dragStart.y) * 0.004));
      updateCamera();
    });
    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoom = Math.max(0.58, Math.min(2.4, zoom * (event.deltaY > 0 ? 1.08 : 0.92)));
      updateCamera();
    }, { passive: false });
    addEventListener("message", (event) => {
      if (event.data?.type === "laonong:raise-terrain") startTerrainRise();
      if (event.data?.type === "laonong:collapse-terrain") collapseTerrain();
      if (event.data?.type === "laonong:reveal-rainfall") revealRainfallSurface();
      if (event.data?.type === "laonong:hide-rainfall") hideRainfallSurface();
      if (event.data?.type === "laonong:reveal-observation-video") revealObservationScreens();
      if (event.data?.type === "laonong:select-stream") selectStreamOnTerrain(event.data.id);
    });

    init().catch((error) => {
      console.error(error);
      stateEl.textContent = "FAILED";
    });
  </script>
</body>
</html>
