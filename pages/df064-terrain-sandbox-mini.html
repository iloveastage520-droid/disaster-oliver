<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 地形沙盤測試</title>
  <style>
    html,
    body,
    #terrain-model {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020617;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }

    .status {
      position: absolute;
      left: 12px;
      bottom: 10px;
      z-index: 2;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 1px 4px rgba(2, 6, 23, 0.86);
    }
  </style>
</head>
<body>
  <div id="terrain-model"></div>
  <div class="status" id="status">20m DTM / 高市DF064</div>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const terrainMeshUrl = "../data/whitebox-tools-test/df064-terrain-mesh.json";
    const laonongDataUrl = "../data/laonong-debris-flow/laonong-alert-torrents.json";
    const params = new URLSearchParams(window.location.search);
    const torrentId = params.get("id") || "高市DF064";
    const alertMode = params.get("alert") || "red";
    const displayMode = params.get("mode") || "simulation";
    const status = document.querySelector("#status");
    let terrainModel = null;
    let progress = 0;

    status.textContent = displayMode === "alert"
      ? `${alertMode === "yellow" ? "黃色" : "紅色"}警戒：潛勢溪流 / ${torrentId}`
      : alertMode === "yellow"
      ? `黃色警戒：潛勢溪流 / ${torrentId}`
      : `紅色警戒：土石流推演 / ${torrentId}`;

    initTerrainModel();

    async function initTerrainModel() {
      const container = document.querySelector("#terrain-model");
      if (!container || !window.THREE) return;
      const mesh = await loadTerrainMesh();
      terrainModel = createTerrainModel(container, mesh);
      window.addEventListener("resize", () => terrainModel.resize());
    }

    async function loadTerrainMesh() {
      const response = await fetch(`${laonongDataUrl}?v=mini-sandboxes`);
      const payload = await response.json();
      const item = (payload.items || []).find((entry) => entry.id === torrentId) || payload.items?.[0];
      if (item?.terrainMeshUrl) {
        const meshResponse = await fetch(`${item.terrainMeshUrl}?v=2025-dem`);
        const mesh = await meshResponse.json();
        mesh.meta = mesh.meta || { id: item.id, status: "2025 20m DEM" };
        return mesh;
      }
      if (torrentId === "高市DF064") {
        const meshResponse = await fetch(`${terrainMeshUrl}?v=mini-only`);
        const mesh = await meshResponse.json();
        mesh.meta = { id: torrentId, status: "20m DTM" };
        return mesh;
      }
      return createSyntheticTerrainMesh(item);
    }

    function createSyntheticTerrainMesh(item) {
      const bounds = item.sandboxBoundsTwd97;
      const cols = 37;
      const rows = 37;
      const xs = Array.from({ length: cols }, (_, index) => bounds.xmin + (bounds.xmax - bounds.xmin) * index / (cols - 1));
      const ys = Array.from({ length: rows }, (_, index) => bounds.ymin + (bounds.ymax - bounds.ymin) * index / (rows - 1));
      const flowline = (item.flowlineTwd97 || []).map((point, index, list) => ({
        x: point.x,
        y: point.y,
        t: list.length <= 1 ? 0 : index / (list.length - 1)
      }));
      const distanceToFlow = (x, y) => flowline.reduce((best, point) => Math.min(best, Math.hypot(x - point.x, y - point.y)), Infinity);
      const heights = ys.map((y, r) => xs.map((x, c) => {
        const downhill = 1 - r / Math.max(rows - 1, 1);
        const ridge = Math.abs(c / Math.max(cols - 1, 1) - 0.5);
        const channel = Math.max(0, 1 - distanceToFlow(x, y) / 520);
        const wave = Math.sin(c * 0.72 + r * 0.38) * 18 + Math.cos(c * 0.22 - r * 0.66) * 12;
        return 520 + downhill * 420 + ridge * 180 + wave - channel * 155;
      }));
      const flat = heights.flat();
      const flowPoints = flowline.length ? flowline.map(({ x, y }) => ({ x, y })) : [
        { x: bounds.xmin + (bounds.xmax - bounds.xmin) * 0.4, y: bounds.ymax - 400 },
        { x: bounds.xmax - 400, y: bounds.ymin + 400 }
      ];
      const buildings = Array.from({ length: 10 }, (_, index) => {
        const base = flowPoints[Math.min(flowPoints.length - 1, Math.floor((index + 1) * flowPoints.length / 12))];
        const side = index % 2 === 0 ? 1 : -1;
        return {
          x: base.x + side * (180 + index * 35),
          y: base.y - 70 + index * 18,
          height: 8 + (index % 4) * 2,
          distance: 450 + index * 80
        };
      });
      return {
        bounds: { xmin: bounds.xmin, xmax: bounds.xmax, ymin: bounds.ymin, ymax: bounds.ymax },
        grid: { xs, ys },
        heights,
        elevation: { min: Math.min(...flat), max: Math.max(...flat) },
        flowline: flowPoints,
        buildings,
        meta: { id: item.id, status: "裁切範圍示意" }
      };
    }

    function createTerrainModel(container, data) {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);
      const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 76, 106);
      camera.lookAt(0, 0, 0);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      container.append(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xe0f2fe, 0x0f172a, 1.55));
      const sun = new THREE.DirectionalLight(0xffffff, 1.1);
      sun.position.set(-40, 70, 50);
      scene.add(sun);

      const xs = data.grid.xs;
      const ys = data.grid.ys;
      const rows = ys.length;
      const cols = xs.length;
      const bounds = data.bounds;
      const widthM = bounds.xmax - bounds.xmin;
      const heightM = bounds.ymax - bounds.ymin;
      const scale = 82 / Math.max(widthM, heightM);
      const zScale = 0.045;
      const minH = data.elevation.min;
      const geometry = new THREE.PlaneGeometry(widthM * scale, heightM * scale, cols - 1, rows - 1);
      geometry.rotateX(-Math.PI / 2);
      const pos = geometry.attributes.position;
      const colors = [];
      for (let r = 0; r < rows; r += 1) {
        for (let c = 0; c < cols; c += 1) {
          const i = r * cols + c;
          const h = data.heights[r][c];
          pos.setY(i, (h - minH) * zScale);
          const t = (h - minH) / Math.max(data.elevation.max - minH, 1);
          const color = new THREE.Color().setHSL(0.32 - t * 0.22, 0.42, 0.24 + t * 0.22);
          colors.push(color.r, color.g, color.b);
        }
      }
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();

      const modelGroup = new THREE.Group();
      scene.add(modelGroup);
      modelGroup.add(new THREE.Mesh(geometry, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));

      const toScene = (point, elevation = minH) => {
        const x = (point.x - (bounds.xmin + bounds.xmax) / 2) * scale;
        const z = -((point.y - (bounds.ymin + bounds.ymax) / 2) * scale);
        const y = (elevation - minH) * zScale + 1.2;
        return new THREE.Vector3(x, y, z);
      };
      const sampleHeight = (point) => {
        let best = minH;
        let dist = Infinity;
        for (let r = 0; r < rows; r += 1) {
          for (let c = 0; c < cols; c += 1) {
            const d = Math.abs(xs[c] - point.x) + Math.abs(ys[r] - point.y);
            if (d < dist) {
              dist = d;
              best = data.heights[r][c];
            }
          }
        }
        return best;
      };
      const isYellowAlert = alertMode === "yellow";
      const isAlertMonitorMode = displayMode === "alert";
      const accent = isYellowAlert ? {
        line: 0xfacc15,
        particle: 0xfde047,
        trailHot: 0xfef08a,
        trailDeep: 0xca8a04,
        deposit: 0xfacc15,
        buildingNear: 0xfde047
      } : {
        line: 0x67e8f9,
        particle: 0xf97316,
        trailHot: 0xffb703,
        trailDeep: 0xc2410c,
        deposit: 0xf97316,
        buildingNear: 0xf97316
      };
      const flowPoints = data.flowline.map((point) => toScene(point, sampleHeight(point)));
      const flowCurve = new THREE.CatmullRomCurve3(flowPoints);
      modelGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(flowCurve.getPoints(220)),
        new THREE.LineBasicMaterial({ color: accent.line, transparent: true, opacity: isYellowAlert ? 0.86 : 1 })
      ));

      const warningRings = [];
      if (isYellowAlert || isAlertMonitorMode) {
        [0.18, 0.48, 0.78].forEach((at, index) => {
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(4.8 + index * 1.3, 5.3 + index * 1.3, 72),
            new THREE.MeshBasicMaterial({
              color: accent.deposit,
              transparent: true,
              opacity: 0.26,
              side: THREE.DoubleSide
            })
          );
          ring.rotation.x = -Math.PI / 2;
          ring.userData.at = at;
          ring.position.copy(flowCurve.getPoint(at));
          ring.position.y += 0.9;
          modelGroup.add(ring);
          warningRings.push(ring);
        });
      }

      const debris = new THREE.Mesh(
        new THREE.SphereGeometry(isYellowAlert ? 1.35 : 2.2, 24, 16),
        new THREE.MeshStandardMaterial({ color: accent.particle, emissive: accent.particle, emissiveIntensity: isYellowAlert ? 0.42 : 0.7, transparent: true, opacity: isYellowAlert ? 0.72 : 1 })
      );
      debris.visible = !isYellowAlert && !isAlertMonitorMode;
      modelGroup.add(debris);
      const debrisTrail = Array.from({ length: isYellowAlert ? 7 : 12 }, (_, index) => {
        const particle = new THREE.Mesh(
          new THREE.SphereGeometry((isYellowAlert ? 1.05 : 1.7) - index * (isYellowAlert ? 0.055 : 0.08), 16, 10),
          new THREE.MeshStandardMaterial({
            color: index < 3 ? accent.trailHot : accent.trailDeep,
            emissive: accent.particle,
            emissiveIntensity: Math.max(isYellowAlert ? 0.12 : 0.18, (isYellowAlert ? 0.36 : 0.54) - index * 0.035),
            transparent: true,
            opacity: Math.max(isYellowAlert ? 0.08 : 0.16, (isYellowAlert ? 0.48 : 0.76) - index * 0.052)
          })
        );
        particle.userData.offset = index * (isYellowAlert ? 0.044 : 0.025) + 0.016;
        particle.userData.side = index % 2 === 0 ? 1 : -1;
        modelGroup.add(particle);
        return particle;
      });
      const deposit = new THREE.Mesh(
        new THREE.CircleGeometry(5, 48),
        new THREE.MeshBasicMaterial({ color: accent.deposit, transparent: true, opacity: 0, side: THREE.DoubleSide })
      );
      deposit.rotation.x = -Math.PI / 2;
      deposit.position.copy(flowPoints[flowPoints.length - 1]);
      deposit.position.y += 0.5;
      deposit.visible = !isYellowAlert && !isAlertMonitorMode;
      modelGroup.add(deposit);
      const depositMound = new THREE.Mesh(
        new THREE.SphereGeometry(6, 32, 16),
        new THREE.MeshStandardMaterial({ color: isYellowAlert ? 0xa16207 : 0xb45309, emissive: isYellowAlert ? 0x854d0e : 0x7c2d12, emissiveIntensity: 0.18, roughness: 0.78, transparent: true, opacity: 0 })
      );
      depositMound.position.copy(flowPoints[flowPoints.length - 1]);
      depositMound.position.y += 0.85;
      depositMound.visible = !isYellowAlert && !isAlertMonitorMode;
      modelGroup.add(depositMound);
      data.buildings.forEach((building) => {
        const p = toScene(building, sampleHeight(building));
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(1.6, Math.max(1.6, building.height * 0.16), 1.6),
          new THREE.MeshStandardMaterial({ color: building.distance < 950 ? accent.buildingNear : 0xe2e8f0, roughness: 0.62 })
        );
        box.position.set(p.x, p.y + box.geometry.parameters.height / 2, p.z);
        modelGroup.add(box);
      });

      const resize = () => {
        const width = container.clientWidth || 1;
        const height = container.clientHeight || 1;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      };
      if (data.meta?.status) {
        status.textContent = isAlertMonitorMode
          ? `${isYellowAlert ? "黃色" : "紅色"}警戒：潛勢溪流 / ${data.meta.id || torrentId}`
          : isYellowAlert
          ? `黃色警戒：潛勢溪流 / ${data.meta.id || torrentId}`
          : `紅色警戒：土石流推演 / ${data.meta.id || torrentId}`;
      }
      const render = () => {
        requestAnimationFrame(render);
        progress = (progress + (isYellowAlert ? 0.0018 : 0.0045)) % 1;
        updateTerrainModel({ flowCurve, debris, debrisTrail, deposit, depositMound, warningRings, isYellowAlert, isAlertMonitorMode }, progress, Math.max(0, progress - 0.72) / 0.28);
        modelGroup.rotation.y += 0.0016;
        renderer.render(scene, camera);
      };
      render();
      return { resize };
    }

    function updateTerrainModel(model, clamped, depositProgress) {
      const point = model.flowCurve.getPoint(clamped);
      const tangent = model.flowCurve.getTangent(clamped);
      const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      if (model.isYellowAlert || model.isAlertMonitorMode) {
        model.debris.visible = false;
        model.debrisTrail.forEach((particle) => {
          particle.visible = false;
        });
        model.deposit.visible = false;
        model.depositMound.visible = false;
        model.warningRings.forEach((ring, index) => {
          const pulse = (clamped * 1.8 + index * 0.24) % 1;
          ring.scale.setScalar(0.82 + pulse * 2.4);
          ring.material.opacity = Math.max(0, 0.34 * (1 - pulse));
        });
        return;
      }
      model.debris.position.copy(point);
      model.debris.position.y += 2;
      model.debris.scale.setScalar(0.72 + Math.sin(clamped * Math.PI) * 0.44);
      model.debrisTrail.forEach((particle, index) => {
        const trailProgress = Math.max(0, clamped - particle.userData.offset);
        const trailPoint = model.flowCurve.getPoint(trailProgress);
        const pulse = Math.sin((clamped * 18) + index * 1.4) * 0.55;
        particle.position.copy(trailPoint);
        particle.position.addScaledVector(side, particle.userData.side * (0.9 + index * 0.06 + pulse));
        particle.position.y += 1.25 + Math.max(0, 1 - index * 0.08);
        particle.visible = clamped > particle.userData.offset * 0.55 && clamped < 0.98;
        particle.material.opacity = Math.max(0.08, (1 - index / model.debrisTrail.length) * Math.min(1, clamped * 3));
      });
      model.deposit.scale.setScalar(0.35 + depositProgress * 5.2);
      model.deposit.material.opacity = depositProgress * 0.42;
      model.depositMound.scale.set(0.4 + depositProgress * 3.6, 0.08 + depositProgress * 0.76, 0.28 + depositProgress * 2.1);
      model.depositMound.material.opacity = depositProgress * 0.82;
      model.depositMound.position.y = model.deposit.position.y + 0.25 + depositProgress * 1.6;
    }
  </script>
</body>
</html>
