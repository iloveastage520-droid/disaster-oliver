<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荖濃溪 DEM 全息地形</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#02090e;color:#c9fffa;font-family:"Noto Sans TC",system-ui,sans-serif}#scene{width:100%;height:100%;display:block}.hud{position:fixed;left:24px;bottom:22px;z-index:2;text-shadow:0 0 12px #24e6df;letter-spacing:.1em}.hud strong{display:block;font-size:18px;margin-bottom:6px}.hud span{font-size:11px;opacity:.72}.scan{display:none}
  </style>
</head>
<body>
  <canvas id="scene"></canvas><div class="scan"></div>
  <div class="hud"><strong>荖濃溪流域｜勤和部落</strong><span>2025 官方 20m DEM · 崩塌後現況模擬套疊｜非測量成果</span></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    const canvas=document.querySelector('#scene');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x02090e,1);
    const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,1000); camera.position.set(0,2.7,5.2); camera.lookAt(0,0,0);
    const root=new THREE.Group(); scene.add(root); scene.add(new THREE.AmbientLight(0x8cfefa,1.4)); const light=new THREE.DirectionalLight(0x5ffff4,2.2); light.position.set(-2,5,4); scene.add(light);
    const data=await fetch('../data/laonong-2025-dem-grid.json').then(r=>r.json());
    const cols=data.x.length, rows=data.y.length, minX=data.x[0], maxX=data.x.at(-1), minY=data.y[0], maxY=data.y.at(-1); const minZ=Math.min(...data.elevation.flat()), maxZ=Math.max(...data.elevation.flat());
    const vertices=[], uvs=[], indices=[]; const relief=0.0028;
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ const z=(data.elevation[j][i]-minZ)*relief; vertices.push((data.x[i]-minX)/(maxX-minX)*4-2,z,(data.y[j]-minY)/(maxY-minY)*3.2-1.6); uvs.push(i/(cols-1),1-j/(rows-1)); }
    for(let j=0;j<rows-1;j++) for(let i=0;i<cols-1;i++){const a=j*cols+i,b=a+1,c=a+cols,d=c+1;indices.push(a,c,b,b,c,d)}
    const geometry=new THREE.BufferGeometry(); geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3)); geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2)); geometry.setIndex(indices); geometry.computeVertexNormals();
    const texture=new THREE.TextureLoader().load('../assets/hologram/laonong-aerial.jpg'); texture.colorSpace=THREE.SRGBColorSpace;
    const terrain=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({map:texture,color:0x72fff1,transparent:true,opacity:.7,roughness:.86,metalness:.1,emissive:0x073b3b,emissiveIntensity:.35,side:THREE.DoubleSide})); root.add(terrain);
    const wire=new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({color:0x32eee5,wireframe:true,transparent:true,opacity:.2})); wire.visible=true; root.add(wire);
    const base=new THREE.Mesh(new THREE.BoxGeometry(4.25,.08,3.45),new THREE.MeshBasicMaterial({color:0x063438,transparent:true,opacity:.72,wireframe:true})); base.visible=true; base.position.y=-.08; root.add(base);
    const ring=new THREE.Mesh(new THREE.RingGeometry(2.2,2.23,96),new THREE.MeshBasicMaterial({color:0x45f4ea,transparent:true,opacity:.55,side:THREE.DoubleSide})); ring.visible=false; ring.rotation.x=-Math.PI/2; ring.position.y=-.02; root.add(ring);
    const hazard=new THREE.Group(); hazard.visible=true; root.add(hazard);
    const terrainHeight=(x,z)=>{const ix=Math.max(0,Math.min(cols-1,Math.round((x+2)/4*(cols-1))));const iz=Math.max(0,Math.min(rows-1,Math.round((z+1.6)/3.2*(rows-1))));return (data.elevation[iz][ix]-minZ)*relief+0.025};
    const drapedArea=(points,material)=>{const verts=[];for(const [x,z] of points)verts.push(x,terrainHeight(x,z),z);const idx=[];for(let i=1;i<points.length-1;i++)idx.push(0,i,i+1);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,material);hazard.add(m);return m};
    const redShape=new THREE.Shape([new THREE.Vector2(.18,1.06),new THREE.Vector2(.72,1.19),new THREE.Vector2(1.16,.98),new THREE.Vector2(.94,.67),new THREE.Vector2(.34,.72),new THREE.Vector2(.02,.92)]);
    const redArea=new THREE.Mesh(new THREE.ShapeGeometry(redShape),new THREE.MeshBasicMaterial({color:0xff405f,transparent:true,opacity:.38,side:THREE.DoubleSide})); redArea.rotation.x=-Math.PI/2; redArea.position.set(0,.92,-.1); hazard.add(redArea);
    const blueShape=new THREE.Shape([new THREE.Vector2(-1.72,-1.12),new THREE.Vector2(-.58,-.88),new THREE.Vector2(.62,-.95),new THREE.Vector2(1.78,-1.28),new THREE.Vector2(1.22,-1.58),new THREE.Vector2(-.62,-1.52)]);
    const blueArea=new THREE.Mesh(new THREE.ShapeGeometry(blueShape),new THREE.MeshBasicMaterial({color:0x258cff,transparent:true,opacity:.27,side:THREE.DoubleSide})); blueArea.rotation.x=-Math.PI/2; blueArea.position.y=.12; hazard.add(blueArea);
    redArea.visible=false; blueArea.visible=false;
    const pathMaterial=new THREE.MeshBasicMaterial({color:0xffe83b,transparent:true,opacity:.46});
    function addFlow(points){const draped=points.map(([x,y,z])=>[x,terrainHeight(x,z)+.035,z]);const curve=new THREE.CatmullRomCurve3(draped.map(([x,y,z])=>new THREE.Vector3(x,y,z)));hazard.add(new THREE.Mesh(new THREE.TubeGeometry(curve,18,.018,5,false),pathMaterial));const tip=draped.at(-1);const arrow=new THREE.Mesh(new THREE.ConeGeometry(.07,.2,5),pathMaterial);arrow.position.set(...tip);arrow.rotation.x=Math.PI/2;hazard.add(arrow)}
    addFlow([[-.15,1.03,.2],[-.45,.82,.05],[-.72,.52,-.45],[-.86,.22,-.94]]);
    addFlow([[.25,1.04,.22],[.06,.78,.02],[-.04,.5,-.46],[-.15,.2,-1.04]]);
    addFlow([[.62,1.01,.18],[.55,.75,-.03],[.56,.46,-.53],[.67,.18,-1.1]]);
    function addLabel(text,x,z){const c=document.createElement('canvas');c.width=320;c.height=72;const ctx=c.getContext('2d');ctx.fillStyle='rgba(2,18,24,.78)';ctx.strokeStyle='#62fff2';ctx.lineWidth=2;ctx.roundRect(2,2,316,68,12);ctx.fill();ctx.stroke();ctx.font='bold 28px sans-serif';ctx.fillStyle='#bffff9';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,160,36);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));sprite.scale.set(.72,.16,1);sprite.position.set(x,terrainHeight(x,z)+.13,z);hazard.add(sprite)}
    addLabel('高市 DF061',-.18,.2); addLabel('高市 DF082',.28,-.04); addLabel('高市 DF117',.62,-.04);
    // Three approximate holographic channels for the official potential debris-flow streams.
    const pulse=new THREE.Mesh(new THREE.RingGeometry(.16,.18,32),new THREE.MeshBasicMaterial({color:0xff405f,transparent:true,opacity:.7,side:THREE.DoubleSide})); pulse.rotation.x=-Math.PI/2; pulse.position.set(.55,.96,.88); hazard.add(pulse);
    pulse.visible=false;
    hazard.children.slice(11).forEach((child) => { child.visible = false; });
    root.rotation.x=-.3; root.rotation.y=-.35;
    let drag=null;
    canvas.addEventListener('pointerdown',(event)=>{drag={x:event.clientX,y:event.clientY,rotationY:root.rotation.y,rotationX:root.rotation.x};canvas.setPointerCapture(event.pointerId)});
    canvas.addEventListener('pointermove',(event)=>{if(!drag)return;root.rotation.y=drag.rotationY+(event.clientX-drag.x)*.008;root.rotation.x=THREE.MathUtils.clamp(drag.rotationX+(event.clientY-drag.y)*.004,-.9,.35)});
    canvas.addEventListener('pointerup',()=>{drag=null}); canvas.addEventListener('pointercancel',()=>{drag=null});
    canvas.addEventListener('wheel', (event) => {
      event.preventDefault();
      camera.position.z = THREE.MathUtils.clamp(camera.position.z + event.deltaY * .0028, 3.1, 8.2);
      camera.fov = THREE.MathUtils.clamp(32 + (camera.position.z - 5.2) * 1.4, 24, 38);
      camera.updateProjectionMatrix();
    }, { passive: false });
    function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()} addEventListener('resize',resize);
    function animate(t){if(!drag)root.rotation.y=-.35+t*.000055; ring.rotation.z=t*.00025; const p=1+Math.sin(t*.002)*.12; pulse.scale.setScalar(p); pulse.material.opacity=.46+Math.sin(t*.002)*.2; renderer.render(scene,camera);requestAnimationFrame(animate)} requestAnimationFrame(animate);
  </script>
</body>
</html>
