<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全國關鍵基礎設施總覽">
  <title>全國關鍵基礎設施總覽 | Disaster Oliver</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Widgets/widgets.min.css">
  <link rel="stylesheet" href="../css/style.css?v=20260807-critical-infrastructure">
  <style>
    body[data-page="critical-infrastructure"] {
      overflow: hidden;
    }

    body[data-page="critical-infrastructure"] main {
      padding: 0;
    }

    .critical-panel h1 {
      font-size: 34px;
      line-height: 1.12;
    }

    .critical-layer {
      background: #ffd166;
    }

    .critical-point {
      background: #38bdf8;
    }

    .critical-cctv {
      background: #fb7185;
    }

    .critical-national {
      background: #a78bfa;
    }

    .critical-road-flow {
      background: #67e8f9;
    }

    .critical-typhoon {
      background: linear-gradient(90deg, #67e8f9, #fb7185);
    }

    .critical-cctv-card {
      display: none;
    }

    .critical-cctv-card.is-compact .critical-cctv-frame {
      display: none;
    }

    .critical-cctv-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .critical-cctv-list button {
      display: grid;
      gap: 3px;
      margin: 0;
      padding: 9px 10px;
      border: 1px solid rgba(226, 232, 240, 0.18);
      border-radius: 6px;
      color: inherit;
      background: rgba(255, 255, 255, 0.055);
      text-align: left;
      cursor: pointer;
    }

    .critical-cctv-list button.is-active {
      border-color: rgba(125, 211, 252, 0.56);
      background: rgba(56, 189, 248, 0.14);
    }

    .critical-cctv-list strong,
    .critical-cctv-frame strong {
      color: #e0f2fe;
      font-size: 13px;
      line-height: 1.35;
    }

    .critical-cctv-list span {
      color: #9fb3ca;
      font-size: 12px;
    }

    .critical-cctv-frame {
      display: grid;
      gap: 8px;
    }

    .critical-cctv-frame video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(226, 232, 240, 0.22);
      border-radius: 6px;
      background: #020711;
      object-fit: cover;
    }

    .critical-cctv-frame a {
      margin-top: 0;
    }

    .critical-floating-video {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 6;
      top: auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 10px;
      width: min(920px, calc(100vw - 36px));
      padding: 10px;
      border: 1px solid rgba(125, 211, 252, 0.42);
      border-radius: 8px;
      color: #e5f7ff;
      background: rgba(3, 12, 24, 0.78);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(14px);
      pointer-events: auto;
      transform: translateX(-50%);
    }

    .critical-floating-video.is-collapsed {
      width: auto;
      min-width: 0;
      grid-template-columns: 1fr;
      padding: 0;
      border-color: rgba(125, 211, 252, 0.5);
      background: rgba(3, 12, 24, 0.86);
    }

    .critical-floating-video.is-collapsed .critical-video-tile {
      display: none;
    }

    .critical-video-toggle {
      display: none;
      min-height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      color: #02111c;
      background: #7dd3fc;
      font-weight: 900;
      cursor: pointer;
    }

    .critical-floating-video.is-collapsed .critical-video-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .critical-video-collapse {
      position: absolute;
      top: -42px;
      right: 0;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(125, 211, 252, 0.42);
      border-radius: 8px;
      color: #bae6fd;
      background: rgba(3, 12, 24, 0.78);
      font-weight: 800;
      cursor: pointer;
    }

    .critical-floating-video.is-collapsed .critical-video-collapse {
      display: none;
    }

    .critical-video-tile {
      display: grid;
      gap: 7px;
      padding: 8px;
      border: 1px solid rgba(226, 232, 240, 0.16);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.055);
      cursor: pointer;
    }

    .critical-video-tile.is-active {
      border-color: rgba(125, 211, 252, 0.72);
      background: rgba(56, 189, 248, 0.14);
      box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.18);
    }

    .critical-video-tile strong {
      display: block;
      color: #e0f2fe;
      font-size: 12px;
      line-height: 1.35;
    }

    .critical-video-tile video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(226, 232, 240, 0.22);
      border-radius: 6px;
      background: #020711;
      object-fit: cover;
    }

    #critical-basemap-select {
      width: 100%;
      min-height: 36px;
      margin-top: 8px;
      border: 1px solid rgba(148, 163, 184, 0.26);
      border-radius: 8px;
      color: #e5eefb;
      background: rgba(15, 23, 42, 0.88);
      padding: 0 10px;
      font: inherit;
    }

    .critical-resource-card {
      --resource-accent: #38bdf8;
      position: absolute;
      top: 76px;
      right: 18px;
      z-index: 4;
      width: min(390px, calc(100vw - 36px));
      padding: 17px 17px 16px;
      border: 1px solid color-mix(in srgb, var(--resource-accent), transparent 18%);
      border-radius: 8px;
      color: #f8fbff;
      background:
        radial-gradient(circle at 22% 8%, color-mix(in srgb, var(--resource-accent), transparent 78%), transparent 30%),
        linear-gradient(145deg, rgba(3, 16, 32, 0.98), rgba(2, 6, 23, 0.98) 48%),
        rgba(2, 6, 23, 0.96);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.46), inset 0 1px 0 rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(12px);
      transform: translateX(0);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .critical-resource-card.is-active {
      animation: critical-card-focus 520ms ease both;
    }

    .critical-resource-card.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(14px);
    }

    .critical-resource-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
    }

    .critical-resource-heading span {
      display: block;
      color: var(--resource-accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .critical-resource-heading strong {
      display: block;
      margin-top: 3px;
      color: #fff7ed;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.35;
    }

    .critical-resource-close {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 999px;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.82);
      cursor: pointer;
    }

    .critical-resource-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .critical-resource-list li {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      min-height: 31px;
      color: #e5eefb;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;
    }

    .critical-resource-card.is-active .critical-resource-list li {
      animation: critical-resource-row-in 420ms ease both;
    }

    .critical-resource-card.is-active .critical-resource-list li:nth-child(1) { animation-delay: 40ms; }
    .critical-resource-card.is-active .critical-resource-list li:nth-child(2) { animation-delay: 75ms; }
    .critical-resource-card.is-active .critical-resource-list li:nth-child(3) { animation-delay: 110ms; }
    .critical-resource-card.is-active .critical-resource-list li:nth-child(4) { animation-delay: 145ms; }
    .critical-resource-card.is-active .critical-resource-list li:nth-child(5) { animation-delay: 180ms; }
    .critical-resource-card.is-active .critical-resource-list li:nth-child(6) { animation-delay: 215ms; }
    .critical-resource-card.is-active .critical-resource-list li:nth-child(7) { animation-delay: 250ms; }

    .critical-resource-list b {
      color: #fff7ed;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .critical-scenario-panel {
      margin: 16px -17px -16px;
      padding: 15px 17px 17px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.28);
    }

    .critical-scenario-panel h3 {
      margin: 0 0 12px;
      color: var(--resource-accent);
      font-size: 15px;
      font-weight: 900;
    }

    .critical-scenario-head,
    .critical-scenario-row {
      display: grid;
      grid-template-columns: 1.45fr 1.08fr 0.92fr;
      gap: 12px;
      align-items: center;
    }

    .critical-scenario-head {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 8px 8px 0 0;
      color: #dbeafe;
      background: rgba(148, 163, 184, 0.12);
      font-size: 13px;
      font-weight: 800;
    }

    .critical-scenario-list {
      display: grid;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .critical-scenario-row {
      position: relative;
      min-height: 74px;
      padding: 12px 12px 12px 30px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      color: #f8fafc;
      font-size: 14px;
      line-height: 1.45;
    }

    .critical-scenario-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 16px;
      bottom: 16px;
      width: 6px;
      border-radius: 999px;
      background: #fde047;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.4);
    }

    .critical-scenario-tools {
      display: flex;
      gap: 7px;
      margin-bottom: 5px;
    }

    .critical-scenario-tools i {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 999px;
      background: #0b7ee8;
      font-style: normal;
      font-size: 14px;
    }

    .critical-scenario-title {
      font-size: 15px;
      font-weight: 800;
    }

    .critical-scenario-agency,
    .critical-scenario-time {
      color: #e5e7eb;
      font-weight: 700;
    }

    @keyframes critical-card-focus {
      0% {
        box-shadow: 0 18px 56px rgba(0, 0, 0, 0.42), 0 0 0 rgba(56, 189, 248, 0);
        transform: translateX(18px) scale(0.985);
      }
      48% {
        box-shadow: 0 24px 78px rgba(0, 0, 0, 0.48), 0 0 34px rgba(56, 189, 248, 0.42);
        transform: translateX(0) scale(1.012);
      }
      100% {
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.46), inset 0 1px 0 rgba(255, 255, 255, 0.09);
        transform: translateX(0) scale(1);
      }
    }

    @keyframes critical-resource-row-in {
      from {
        opacity: 0;
        transform: translateX(10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>
<body data-page="critical-infrastructure">
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="Disaster Oliver 首頁">
      <span class="brand-mark">DO</span>

  </header>

  <main class="cesium-page">
    <section class="cesium-stage" aria-label="全國關鍵基礎設施總覽場景">
      <div id="critical-container" class="cesium-container"></div>

      <aside class="cesium-control-panel critical-panel is-collapsed" aria-label="關鍵基礎設施控制">
        <button class="cesium-panel-toggle" type="button" aria-expanded="false">控制</button>
        <div class="cesium-panel-content">
          <p class="eyebrow">Critical Infrastructure</p>
          <h1>全國關鍵基礎設施總覽</h1>
          <div class="cesium-status-grid">
            <div>
              <span>全台</span>
              <strong>66 處</strong>
            </div>
            <div>
              <span>已定位</span>
              <strong>1 處</strong>
            </div>
            <div>
              <span>周邊建物</span>
              <strong id="critical-building-status">讀取中</strong>
            </div>
          </div>
          <div class="cesium-actions" role="group" aria-label="鏡頭控制">
            <button class="button button-primary" type="button" data-camera="overview">總覽</button>
            <button class="button button-secondary" type="button" data-camera="local">保二</button>
            <button class="button button-secondary" type="button" data-camera="low">低空斜視</button>
            <button class="button button-secondary" type="button" data-camera="top">俯視</button>
            <button class="button button-secondary" type="button" data-camera="typhoon">颱風</button>
          </div>
          <label class="check-field cesium-toggle">
            <span>底圖</span>
            <select id="critical-basemap-select" aria-label="底圖選項">
              <option value="dark">暗色科技底圖</option>
              <option value="google-hybrid">Google 混合衛星</option>
            </select>
          </label>
          <label class="check-field cesium-toggle">
            <input id="critical-building-toggle" type="checkbox" checked>
            <span>周邊建物</span>
          </label>
          <label class="check-field cesium-toggle">
            <input id="critical-radius-toggle" type="checkbox" checked>
            <span>500m 範圍</span>
          </label>
          <label class="check-field cesium-toggle">
            <input id="critical-road-toggle" type="checkbox" checked>
            <span>道路流光</span>
          </label>
          <label class="check-field cesium-toggle">
            <input id="critical-national-toggle" type="checkbox" checked>
            <span>全台 66 處</span>
          </label>
          <label class="check-field cesium-toggle">
            <input id="critical-typhoon-toggle" type="checkbox" checked>
            <span>颱風路徑</span>
          </label>
        </div>
      </aside>

      <aside class="critical-resource-card is-hidden" id="critical-resource-card" aria-label="設施勤務資源">
        <div class="critical-resource-heading">
          <div>
            <span id="critical-resource-category">關鍵基礎設施</span>
            <strong id="critical-resource-title">選取設施</strong>
          </div>
          <button class="critical-resource-close" id="critical-resource-close" type="button" aria-label="關閉設施資訊">×</button>
        </div>
        <ul class="critical-resource-list" id="critical-resource-list"></ul>
        <div class="critical-scenario-panel">
          <h3>即時推演</h3>
          <div class="critical-scenario-head">
            <span>專案名稱</span>
            <span>建立者</span>
            <span>建立時間</span>
          </div>
          <ul class="critical-scenario-list" id="critical-scenario-list"></ul>
        </div>
      </aside>

      <aside class="cesium-livecam-card critical-cctv-card is-compact" aria-label="附近即時影像">
        <div class="cesium-livecam-heading">
          <span>Live CCTV</span>
          <strong>附近即時影像</strong>
        </div>
        <div class="critical-cctv-frame">
          <strong id="critical-cctv-title">新店寶橋路235巷</strong>
          <a id="critical-cctv-link" href="https://focustaiwan.net/cctv/c000033" target="_blank" rel="noopener">開啟原始影像頁</a>
        </div>
        <div class="critical-cctv-list">
          <button class="is-active" type="button" data-cctv-index="0">
            <strong>新店寶橋路235巷</strong>
            <span>約 190m · 新北市政府交通局</span>
          </button>
          <button type="button" data-cctv-index="1">
            <strong>寶橋路、中興路口</strong>
            <span>約 380m · 新北市政府</span>
          </button>
          <button type="button" data-cctv-index="2">
            <strong>北新路二段、寶橋路口</strong>
            <span>約 890m · 新北市政府交通局</span>
          </button>
        </div>
      </aside>

      <div class="critical-floating-video" id="critical-floating-video-card" aria-label="附近 CCTV 影像列">
        <button class="critical-video-toggle" id="critical-video-toggle" type="button">即時影像 3</button>
        <button class="critical-video-collapse" id="critical-video-collapse" type="button">收合</button>
        <button class="critical-video-tile is-active" type="button" data-cctv-index="0">
          <strong>新店寶橋路235巷</strong>
          <video id="critical-cctv-video-0" controls autoplay muted playsinline></video>
        </button>
        <button class="critical-video-tile" type="button" data-cctv-index="1">
          <strong>寶橋路、中興路口</strong>
          <video id="critical-cctv-video-1" controls autoplay muted playsinline></video>
        </button>
        <button class="critical-video-tile" type="button" data-cctv-index="2">
          <strong>北新路二段、寶橋路口</strong>
          <video id="critical-cctv-video-2" controls autoplay muted playsinline></video>
        </button>
      </div>
    </section>
  </main>
