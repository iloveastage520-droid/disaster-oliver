<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Disaster Oliver CesiumJS 3D disaster map test.">
  <title>CesiumJS 3D 測試 | Disaster Oliver</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Widgets/widgets.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-page="cesium-3d-test">
  <header class="site-header">
    <a class="brand" href="../../index.html" aria-label="Disaster Oliver 首頁">
      <span class="brand-mark">DO</span>
      <span class="brand-text">Disaster Oliver</span>
    </a>
    <nav class="site-nav" aria-label="主要導覽">
      <a href="../news-map.html">新聞地圖</a>
      <a href="../flood-potential.html">淹水潛勢</a>
      <a href="../himawari-height-test.html">向日葵高度感</a>
      <a href="./">Cesium 3D</a>
    </nav>
  </header>

  <main class="cesium-page">
    <section class="cesium-stage" aria-label="CesiumJS 3D 測試場景">
      <div id="cesium-container" class="cesium-container"></div>

      <aside class="cesium-control-panel" aria-label="3D 測試控制">
        <p class="eyebrow">CesiumJS</p>
        <h1>3D 災害圖層測試</h1>
        <div class="cesium-status-grid">
          <div>
            <span>場景</span>
            <strong>台北東側</strong>
          </div>
          <div>
            <span>資料</span>
            <strong>真實建物</strong>
          </div>
          <div>
            <span>Token</span>
            <strong>不需要</strong>
          </div>
        </div>
        <div class="cesium-actions" role="group" aria-label="鏡頭控制">
          <button class="button button-primary" type="button" data-camera="overview">總覽</button>
          <button class="button button-secondary" type="button" data-camera="low">低空斜視</button>
          <button class="button button-secondary" type="button" data-camera="tower">高度柱</button>
        </div>
        <label class="check-field cesium-toggle">
          <input id="cesium-radar-toggle" type="checkbox" checked>
          <span>雷達回波 <strong id="cesium-radar-status">載入中</strong></span>
        </label>
        <div class="cesium-actions cesium-radar-actions" role="group" aria-label="雷達控制">
          <button class="button button-secondary" id="cesium-radar-play" type="button">播放雷達</button>
        </div>
        <label class="check-field cesium-toggle">
          <input id="cesium-simulated-radar-toggle" type="checkbox" checked>
          <span>假雷達強回波</span>
        </label>
        <label class="check-field cesium-toggle">
          <input id="cesium-real-building-toggle" type="checkbox" checked>
          <span>真實 3D 建物 <strong id="cesium-real-building-status">讀取中</strong></span>
        </label>
      </aside>

      <div class="cesium-legend" aria-label="3D 圖例">
        <strong>圖層</strong>
        <span><i class="cesium-radar"></i>雷達回波</span>
        <span><i class="cesium-simulated-radar"></i>假雷達強回波</span>
        <span><i class="cesium-real-building"></i>真實 3D 建物</span>
      </div>
    </section>
  </main>

  <script>
    window.CESIUM_BASE_URL = "https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/";
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.120.0/Cesium.js"></script>
  <script src="../../js/cesium-3d-test.js?v=20260731-animated-radar-buildings"></script>
</body>
</html>
