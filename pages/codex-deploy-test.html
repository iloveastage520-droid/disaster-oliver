<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex 部署測試</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5f6878;
      --line: #d8dee8;
      --accent: #0f8b8d;
      --accent-2: #f2b84b;
      --bg: #f7f9fb;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(15, 139, 141, 0.12), transparent 38%),
        linear-gradient(315deg, rgba(242, 184, 75, 0.18), transparent 34%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(680px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: clamp(24px, 5vw, 44px);
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.10);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(15, 139, 141, 0.14);
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(32px, 7vw, 52px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 12px 18px;
      margin: 28px 0 0;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    dt {
      color: var(--muted);
      font-weight: 700;
    }

    dd {
      margin: 0;
      font-family: Consolas, "Courier New", monospace;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot" aria-hidden="true"></span>部署測試頁已建立</div>
    <h1>Codex Deploy Test</h1>
    <p>如果你在 Cloudflare Pages 網址看到這一頁，就表示這次從本機到線上發布的流程可以正常運作。</p>
    <dl>
      <dt>建立時間</dt>
      <dd>2026-07-31 10:43:53 +08:00</dd>
      <dt>測試路徑</dt>
      <dd>/pages/codex-deploy-test.html</dd>
      <dt>專案</dt>
      <dd>disaster-oliver</dd>
    </dl>
  </main>
</body>
</html>
